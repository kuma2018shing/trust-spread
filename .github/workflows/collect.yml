name: collect

on:
  schedule:
    - cron: "7,37 * * * *"     # twice an hour, offset off the hour
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # collect.py is stdlib-only on purpose: no install step, nothing to
      # break on a dependency bump, and it runs free on the Actions tier.
      - name: Snapshot books
        working-directory: collector
        run: python collect.py --fiat ZAR KES --out ../data

      - name: Commit
        run: |
          git config user.name  "trust-spread-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "data: snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase --autostash origin master || true
            git push
          fi
